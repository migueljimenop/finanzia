services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzia
      POSTGRES_PASSWORD: finanzia
      POSTGRES_DB: finanzia
    ports:
      - "5432:5432"
    volumes:
      - finanzia_db_data:/var/lib/postgresql/data

volumes:
  finanzia_db_data:
